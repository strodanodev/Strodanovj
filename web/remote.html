<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strodano VJ Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="logo.png">
<!-- Strodano VJ - the remote control screen: a phone plays the show running in the desktop app. GPL-3.0.
     Served at /remote (vercel.json rewrite) and as remote.html. The pairing secret is in the #fragment (from the QR code)
     or comes from the short code typed here, so it never reaches this server. This page runs no engine: it sends
     commands up and mirrors the host's state, over remotelink.js. Nothing of the show is stored on this device.
     The host's side is part of Festival. See ../../remote-control-spec.md. -->
<script>window.VJ_THEME_KEY = 'strodano.theme.mobile'; window.VJ_THEME_DEFAULT = 'strodano';</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="theme.js"></script>
<style>
/* Same tokens and controls as the phone app (mobile.html); theme.js may override --acc* on <html>. */
:root{
  --bg:#000;--card:#0a0a0d;--line:#18191f;--ctl:#121319;--ctl-line:#262833;--field:#06060a;
  --acc:#2a6cff;--acc-muted:rgba(42,108,255,.2);--acc-btn:rgba(42,108,255,.15);--acc-soft:rgba(42,108,255,.1);--on-acc:#fff;
  --txt:#f3f4f6;--dim:#868a93;--faint:#4d5059;--warn:#e3a52b;--bad:#ff1f3d;
  --calm:#2a6cff;--groove:#8a5cff;--peak:#ff4fa0;--drop:#ff1f3d;
  --sans:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:'Chakra Petch','IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:44px;--r:12px;--r-lg:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:400 15px/1.35 var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{background:var(--ctl);border:1px solid var(--ctl-line);border-radius:var(--r);min-height:var(--tap);padding:0 14px;cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s,transform .08s,color .12s}
button:active{transform:scale(.97);background:#25252b}
button.on{background:var(--acc-btn);color:var(--acc);border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
button.big{width:100%;min-height:54px;font-weight:600;font-size:16px}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.armed{background:rgba(255,31,61,.22);border-color:var(--bad);color:#fff}
button.sq{min-width:var(--tap);padding:0;font-weight:700;font-size:13px}
input[type=text]{background:var(--field);border:1px solid var(--ctl-line);border-radius:var(--r);min-height:54px;padding:0 12px;outline:none;width:100%;user-select:text;-webkit-user-select:text}
input[type=text]:focus{border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;touch-action:pan-y;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),#2b2b32 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#2b2b32}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
h3{margin:20px 2px 8px;font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hint{color:var(--dim);font-size:13px;margin:6px 2px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.shrink{flex:0 0 auto}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.name small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:6px}

/* header: who we control, the link's health, and BLACKOUT, always in reach */
#top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line)}
#who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
body.live #dot{background:var(--acc);box-shadow:0 0 10px var(--acc)}
body.away #dot{background:var(--warn);box-shadow:none}
#who b{display:block;font:600 15px var(--display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who small.slow{color:var(--warn)}
#black{flex:none;min-height:48px;min-width:132px;font:700 13px var(--display);letter-spacing:.1em;border-color:var(--bad);color:var(--bad);background:rgba(255,31,61,.08)}
#black.on{background:var(--bad);color:#fff;animation:blk 1s ease-in-out infinite}
@keyframes blk{50%{opacity:.6}}
#lost{display:none;background:rgba(227,165,43,.14);color:var(--warn);border-bottom:1px solid rgba(227,165,43,.4);padding:8px 12px;font-size:13px}
body.away #lost{display:block}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
body.away #view{opacity:.45}
#tabs{display:flex;background:rgba(0,0,0,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
#tabs button{flex:1;border:0;background:none;min-height:48px;font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-radius:12px}
#tabs button.on{color:var(--acc);background:var(--acc-soft)}
#tabs button:active{transform:none}

/* Clips: scenes (columns), then a card per layer */
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scene{aspect-ratio:16/10;min-height:0;border-radius:12px;padding:0;position:relative;overflow:hidden;background:#141418 center/cover no-repeat;border:1px solid var(--line);--c:var(--faint);box-shadow:inset 0 -3px 0 var(--c)}
.scene::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.78))}
.scene b{position:absolute;right:7px;top:6px;font-size:12px;color:rgba(255,255,255,.85)}
.scene small{position:absolute;left:8px;bottom:8px;font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 4px #000}
.scene.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--c),0 0 14px var(--acc-muted)}
.scene.calm{--c:var(--calm)}.scene.groove{--c:var(--groove)}.scene.peak{--c:var(--peak)}.scene.drop{--c:var(--drop)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tile{flex:0 0 112px;height:63px;min-height:0;border-radius:10px;background:#18181d center/cover no-repeat;border:2px solid transparent;position:relative;overflow:hidden;scroll-snap-align:start;padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.tile span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:500;padding:10px 6px 3px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tile .num{position:absolute;left:5px;top:4px;font-size:10px;font-weight:700;font-style:normal;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.6);color:#ddd}
.tile .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
.tile.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-muted)}
.tile.pending{border-color:var(--warn)}
.tile.off{filter:saturate(.5) brightness(.6)}
.tile .tag{position:absolute;right:4px;top:4px;font:700 9px var(--mono);font-style:normal;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.72);color:var(--warn)}
/* the monitor: the host's live picture, above the tabs' content */
#mon{position:relative;background:#000;border-bottom:1px solid var(--line);display:flex;justify-content:center;flex:none}
#mon[hidden]{display:none}
#pv{display:block;width:100%;max-height:30vh;aspect-ratio:var(--ar,16 / 9);object-fit:contain;background:#000}
#pvBtn{position:absolute;right:8px;top:8px;min-height:30px;padding:0 10px;font-size:11px;border-radius:15px;background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.22);color:#ddd}
#mon.off{justify-content:flex-end;padding:6px 8px}#mon.off #pv{display:none}#mon.off #pvBtn{position:static}
body.away #pv{opacity:.45}
/* Effects: hold-to-apply pads */
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pads button{min-height:56px;padding:0 4px;font-size:12px;font-weight:600;touch-action:none;line-height:1.15}
.pads button.held{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
/* Mix */
.bpm{font:700 34px var(--mono);letter-spacing:.02em}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#2b2b32}.dots i.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.snaps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snaps button{min-height:50px;padding:0;font-weight:700;color:var(--faint);border-style:dashed}
.snaps button.has{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

/* the cover: connect, wait, refused */
#cover{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#cover[hidden]{display:none}
#cover img{width:min(200px,46vw);height:auto;filter:drop-shadow(0 0 24px var(--acc-muted))}
#cover h1{margin:0;font:700 20px var(--display);letter-spacing:.12em;text-transform:uppercase}
#cover p{margin:0;color:var(--dim);max-width:340px;line-height:1.45}
#cover p.err{color:var(--bad)}
#cover form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#code{font:600 26px var(--mono);letter-spacing:.14em;text-align:center;text-transform:uppercase}
#cover a{color:var(--dim);font-size:13px}
#saved{display:flex;flex-direction:column;gap:8px;width:min(320px,100%)}#saved[hidden]{display:none}
#saved .row button.pri{min-height:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--ctl-line);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:12px;right:12px;top:calc(64px + var(--safe-t));z-index:60;background:#15161c;border:1px solid var(--ctl-line);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{border-color:var(--bad)}
</style>
</head>
<body>
<header id="top">
  <div id="who"><i id="dot"></i><div style="min-width:0"><b id="hostName">Remote</b><small id="linkText">Not connected</small></div></div>
  <button id="black" aria-label="Blackout">BLACKOUT</button>
</header>
<div id="lost" role="status">Connection lost. Reconnecting... This is the last state this phone saw.</div>
<div id="mon" hidden><video id="pv" muted playsinline autoplay disablepictureinpicture></video><button id="pvBtn">Preview: high</button></div>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="cover">
  <img src="logo.png" alt="STRODANO">
  <h1>Remote control</h1>
  <p id="coverText"></p>
  <div id="spin" hidden></div>
  <form id="codeForm" autocomplete="off">
    <input id="code" type="text" inputmode="text" maxlength="9" placeholder="XXXX-XXXX" aria-label="Code shown on the computer" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button class="pri big" type="submit">Connect</button>
  </form>
  <div id="saved" hidden></div>
  <button id="coverBtn" class="ghost" hidden></button>
  <a id="backLink" href="mobile.html">Open Strodano VJ on this phone instead</a>
</div>
<div id="toast" role="status"></div>
<script src="core.js"></script>
<script src="remotelink.js"></script>
<script src="remote.js"></script>
</body>
</html>
