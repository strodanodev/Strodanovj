<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strodano VJ Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strodano VJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>window.VJ_AUTOSAVE_KEY = 'strodano-vj-mobile-autosave'; window.VJ_MOBILE = true; window.VJ_THEME_KEY = 'strodano.theme.mobile'; window.VJ_THEME_DEFAULT = 'strodano';</script>
<!-- the website's faces; offline (or blocked) the system fonts below take over -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="theme.js"></script>
<style>
/* Strodano VJ mobile: one-thumb layout. Output monitor on top, five tabs at the bottom, a bottom sheet for every choice.
   Tokens first; theme.js may override --acc* on <html>. */
:root{
  --bg:#000;--card:#0a0a0d;--card-2:#101015;--line:#18191f;--ctl:#121319;--ctl-line:#262833;--top:#000;--field:#06060a;
  --acc:#2a6cff;--acc-muted:rgba(42,108,255,.2);--acc-btn:rgba(42,108,255,.15);--acc-soft:rgba(42,108,255,.1);--on-acc:#fff;
  --txt:#f3f4f6;--dim:#868a93;--faint:#4d5059;--ok:#2ea44f;--warn:#e3a52b;--bad:#ff1f3d;
  --live:#ff1f3d;--live-hi:#ff6075;--live-a:rgba(255,31,61,.45);
  --calm:#2a6cff;--groove:#8a5cff;--peak:#ff4fa0;--drop:#ff1f3d;
  --sans:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:'Chakra Petch','IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:44px;--r:12px;--r-lg:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:400 15px/1.35 var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{background:var(--ctl);border:1px solid var(--ctl-line);border-radius:var(--r);min-height:var(--tap);padding:0 14px;cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s,transform .08s,color .12s}
button:active{transform:scale(.97);background:#25252b}
button.on{background:var(--acc-btn);color:var(--acc);border-color:var(--acc)}
button.big{width:100%;min-height:54px;font-weight:600;font-size:16px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.danger{color:var(--bad)} button.armed{background:rgba(255,31,61,.22);border-color:var(--bad);color:#fff}
button:disabled{opacity:.35}
button.icon{min-width:var(--tap);padding:0;display:inline-flex;align-items:center;justify-content:center}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
select,input[type=text]{background:var(--field);border:1px solid var(--ctl-line);border-radius:var(--r);min-height:var(--tap);padding:0 12px;outline:none;width:100%}
select:focus,input[type=text]:focus{border-color:var(--acc)}
/* sliders: thick filled track, big thumb. --p (0..100%) is kept up to date by mobileui.js */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;touch-action:pan-y;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),#2b2b32 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#2b2b32}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
input[type=checkbox].sw{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:#2b2b32;position:relative;flex:none;transition:background .15s;margin:0}
input[type=checkbox].sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox].sw:checked{background:var(--acc)}input[type=checkbox].sw:checked::after{transform:translateX(18px)}
h3{margin:22px 2px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
h3 .x{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.hint{color:var(--dim);font-size:13px;margin:6px 2px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.shrink{flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin:10px 0}
.setting{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}.setting>span{flex:1}.setting select{width:auto;max-width:55%}

#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t)}
#top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--top)}
#top .brand{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#top .brand img{height:26px;width:auto}
#top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--dim)}
@media (max-width:400px){#top .brand span{display:none}}
#top button{min-height:34px;padding:0 12px;font-size:13px;border-radius:17px}
#bpmBtn{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
#dots{display:flex;gap:3px}#dots i{width:6px;height:6px;border-radius:50%;background:#3a3a42;transition:background .06s}#dots i.on{background:var(--acc)}
#setBtn{min-width:34px;padding:0;color:var(--dim)}
#blackBtn{font-weight:700;letter-spacing:.08em;color:var(--bad);border-color:rgba(255,31,61,.45);background:rgba(255,31,61,.08)}
#blackBtn.on{background:var(--bad);border-color:var(--bad);color:#fff}
#installBtn{background:var(--acc-btn);color:var(--acc);border-color:var(--acc)}#installBtn[hidden]{display:none}
#stage{position:relative;flex:0 0 auto;padding:0 12px 10px;background:var(--top)}
#monWrap{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
#mon{display:block;width:100%;aspect-ratio:16/9;max-height:32vh;object-fit:contain;background:#000}
#badge{position:absolute;left:8px;top:8px;display:flex;gap:6px}
#badge span{font:700 10px var(--sans);letter-spacing:.1em;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.65);color:#ddd;display:flex;align-items:center;gap:5px}
#badge span.live{background:var(--bad);color:#fff}#badge span.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
#badge span.auto{background:var(--acc);color:#0a0a0a}#badge span.black{background:#fff;color:#000}
@keyframes blink{50%{opacity:.25}}
#fps{position:absolute;right:8px;top:8px;font:600 10px ui-monospace,monospace;color:#ccc;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:6px}
#fps.bad{color:var(--warn)}
/* the monitor can be made small (settings pref monSmall) to leave more room for the controls */
#monBtn{position:absolute;right:6px;bottom:6px;min-height:0;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:rgba(0,0,0,.55);color:#ccc;display:flex;align-items:center;justify-content:center}
#monBtn svg{transition:transform .15s}#stage.small #monBtn svg{transform:rotate(180deg)}
@media (orientation:portrait){#stage.small #mon{max-height:13vh}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:rgba(10,10,12,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
#tabs button{flex:1;border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);padding:0;border-radius:12px}
#tabs button .pill{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--txt)}#tabs button.on .pill{background:var(--acc-muted);color:var(--acc)}
#tabs button:active{transform:none;background:none}

/* scenes */
.scenes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.scenes::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.scene{flex:0 0 84px;height:84px;border-radius:14px;padding:0;position:relative;overflow:hidden;background:#141418 center/cover no-repeat;border:2px solid var(--line);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.scene b{position:absolute;left:8px;top:6px;font-size:20px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.scene small{margin:0 6px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6)}
.scene.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-muted)}
.mood-Calm{color:var(--calm)}.mood-Groove{color:var(--groove)}.mood-Peak{color:var(--peak)}.mood-Drop{color:var(--drop)}
/* layers and clip tiles */
.layer{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 10px 4px;margin:10px 0}
.layer.off{opacity:.55}
.lhead{display:flex;align-items:center;gap:6px}
.lhead .nm{flex:1;min-width:0}
.lhead .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .nm small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead button{min-height:40px;min-width:40px;padding:0 10px;font-size:13px;border-radius:10px}
.lhead button.icon{padding:0}
button.held{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
.lvl{display:flex;align-items:center;gap:10px;margin:2px 0}
.lvl span{font-size:12px;color:var(--dim);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.tile{flex:0 0 112px;height:63px;border-radius:10px;background:#18181d center/cover no-repeat;border:2px solid transparent;position:relative;overflow:hidden;scroll-snap-align:start;padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.tile span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:500;padding:10px 6px 3px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tile .num{position:absolute;left:5px;top:4px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.6);color:#ddd}
.tile .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
.tile .prolock{position:absolute;right:4px;top:4px;font:700 9px var(--mono);letter-spacing:.08em;font-style:normal;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.72);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)} .tile.prolocked{filter:saturate(.6) brightness(.75)}
.tile.empty{border:1.5px dashed #34343c;box-shadow:none;color:var(--faint);font-size:24px;background:none}
.tile.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-muted)}
.tile.pending{border-color:var(--warn)}
.tile.miss::after{content:'missing';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);color:var(--bad);font-size:12px;font-weight:600}
/* pads, snapshots */
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pads button{min-height:64px;font-size:12px;font-weight:600;padding:0 4px;touch-action:none;border-radius:14px;background:linear-gradient(160deg,#1f1f25,#15151a)}
.pads button.held{background:var(--acc);color:#0a0a0a;border-color:var(--acc);box-shadow:0 0 18px var(--acc-muted)}
.snaps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snaps button{min-height:50px;padding:0;font-weight:700;touch-action:none;color:var(--faint);border-style:dashed}
.snaps button.has{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;border-radius:20px;font-size:14px}
.seg{display:flex;background:var(--field);border:1px solid var(--ctl-line);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:9px;font-size:14px;color:var(--dim);padding:0 6px}
.seg button.on{background:var(--ctl);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.meter{height:8px;border-radius:4px;background:#222228;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--groove),var(--warn) 75%,var(--bad));transition:width .08s}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--card-2);border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-transform:capitalize}.stat small{color:var(--dim);font-size:11px}
/* Auto: the big round start button pulses with the beat */
.go{display:flex;flex-direction:column;align-items:center;padding:18px 0 4px}
.gobtn{width:152px;height:152px;border-radius:50%;padding:0;border:0;background:radial-gradient(circle at 35% 30%,#ff8fb0,var(--acc) 55%,#7a2f4a);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc) 65%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 45%,#000));color:#0a0a0a;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 40px var(--acc-muted);position:relative}
.gobtn svg{width:34px;height:34px;stroke:#0a0a0a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gobtn.on{background:radial-gradient(circle at 35% 30%,#2d2d35,#17171c);color:var(--txt);box-shadow:0 0 0 2px var(--acc)}
.gobtn.on svg{stroke:var(--acc)}
.gobtn .ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);opacity:0;pointer-events:none}
.gobtn.on .ring.beat{animation:ring .45s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(.96)}to{opacity:0;transform:scale(1.12)}}
.go .sub{margin-top:12px;color:var(--dim);font-size:13px;text-align:center;max-width:300px}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.lib .tile{flex:none;width:100%;height:auto;aspect-ratio:16/9}
.lib .tile .k{position:absolute;right:4px;top:4px;font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(0,0,0,.65);padding:2px 5px;border-radius:4px}
.empty-state{text-align:center;padding:30px 16px;color:var(--dim)}
.empty-state svg{width:54px;height:54px;stroke:var(--faint);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.empty-state b{display:block;color:var(--txt);font-size:16px;margin-bottom:4px}
/* broadcast */
.livecard{display:flex;align-items:center;gap:12px}
.livecard .dot{width:12px;height:12px;border-radius:50%;background:var(--faint);flex:none}
.livecard.on .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(255,31,61,.25);animation:blink 1.2s infinite}
.livecard .t{flex:1;min-width:0}.livecard .t b{display:block;font-size:16px}.livecard .t small{color:var(--dim);font-size:12px}
.livecard .v{text-align:center}.livecard .v b{display:block;font-size:24px;font-weight:700;line-height:1}.livecard .v small{color:var(--dim);font-size:11px}
.qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:16px;margin:12px auto;width:max-content}
.qr canvas{display:block;width:200px;height:200px;image-rendering:pixelated}
.link{font:12px ui-monospace,monospace;word-break:break-all;color:var(--dim);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:text;-webkit-user-select:text}
.steps{margin:4px 0 0;padding-left:20px;color:var(--dim);font-size:13px}.steps li{margin:6px 0}.steps b{color:var(--txt);font-weight:600}
.welcome{background:linear-gradient(150deg,var(--acc-soft),transparent 70%),var(--card);border-color:var(--acc-muted)}
.welcome ol{margin:6px 0 10px;padding-left:20px;color:var(--dim);font-size:14px}.welcome li{margin:5px 0}.welcome li b{color:var(--txt)}
.slow{border-color:rgba(227,165,43,.5);background:rgba(227,165,43,.07)}
.swatches{display:flex;gap:6px;justify-content:space-between}
.swatches button{flex:0 0 44px;min-height:44px;padding:0;border-radius:50%;background:none;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.swatches button::after{content:'';width:28px;height:28px;border-radius:50%;background:var(--sw)}.swatches button.on{border-color:var(--sw)}
/* settings rows built by shared modules (fld() in core.js, CLIP_TYPES props) */
.fld{display:flex;gap:10px;align-items:center;margin:2px 0;min-height:40px}.fld label{flex:0 0 92px;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld input[type=range]{flex:1}.fld output{flex:0 0 36px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.fld select,.fld input[type=text]{flex:1;width:auto}.props textarea{width:100%;min-height:80px;background:var(--field);color:var(--txt);border:1px solid var(--ctl-line);border-radius:var(--r);padding:10px;font:inherit}
.props h4{margin:12px 0 4px;color:var(--dim);font-size:13px}.props button{min-height:38px}

/* bottom sheet: swipe its header down (or tap outside) to close */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;animation:fade .18s}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:#141418;border-radius:22px 22px 0 0;border-top:1px solid var(--ctl-line);padding:0 14px calc(18px + var(--safe-b));z-index:21;animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#sheet .sh{position:sticky;top:0;background:#141418;padding:8px 0 6px;z-index:1;touch-action:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#46464f;margin:2px auto 8px}
#sheet .sh .row{gap:10px}#sheet h2{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrim[hidden],#sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
#status{position:fixed;left:12px;right:12px;top:calc(54px + var(--safe-t));z-index:30;background:rgba(28,28,33,.97);border:1px solid var(--ctl-line);border-radius:14px;padding:11px 14px;font-size:14px;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#status.show{opacity:1;transform:none}#status.bad{border-color:var(--bad)}
#nogl{padding:30px;font-size:16px}

@media (orientation:landscape) and (max-height:540px){
  #app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto 1fr auto}
  #top{grid-column:1/3}#stage{grid-row:2/4;display:flex;align-items:center;justify-content:center;padding-bottom:12px}
  #monWrap{width:auto;max-width:100%}#mon{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 70px - var(--safe-t));aspect-ratio:auto}
  #view{grid-column:2;grid-row:2}#tabs{grid-column:2;grid-row:3}#monBtn{display:none}
}
@media (min-width:700px){#view{padding-left:max(12px,calc(50% - 330px));padding-right:max(12px,calc(50% - 330px))}#mon{max-height:40vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* STRODANO type (UI 2.0, step 1): Chakra Petch for labels, tabs and big buttons, JetBrains Mono for numbers */
h3,#tabs button,button.big,#blackBtn,.pads button,.snaps button,.scene small,.gobtn,.livecard .t b,.stat small,.empty-state b,.lhead .nm b{font-family:var(--display)}
h3{font-weight:600;letter-spacing:.14em}
#tabs button{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
button.big{letter-spacing:.06em}
#blackBtn{letter-spacing:.12em}
.pads button{letter-spacing:.06em;text-transform:uppercase}
#bpmBtn,#fps,#badge span,.stat b,.livecard .v b,.lvl span,.fld output,.link,.tile .num,.lib .tile .k,.scene b{font-family:var(--mono)}
#badge span.auto{color:var(--on-acc)}
.gobtn{color:var(--on-acc)}.gobtn svg{stroke:var(--on-acc)}
.meter i{background:linear-gradient(90deg,var(--calm),var(--groove) 40%,var(--peak) 72%,var(--drop))}
#tabs{background:rgba(0,0,0,.96)}

/* UI 2.0 step 2: the live state. Red means on air everywhere (monitor edge, LIVE pill, Live tab); the electric edge
   marks what is going out now: the monitor while broadcasting (red), the playing scene (blue). */
.scene.on::after,body.on-air #monWrap::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  border:2px solid var(--e-hi,#6f9bff);opacity:.95;filter:url(#electric) drop-shadow(0 0 3px var(--e,var(--acc))) drop-shadow(0 0 8px var(--e,var(--acc)))}
.scene.on{--e:var(--acc);--e-hi:color-mix(in srgb,var(--acc) 60%,#fff);border-color:transparent;box-shadow:0 0 14px var(--acc-muted)}
body.on-air #monWrap{--e:var(--live);--e-hi:var(--live-hi);box-shadow:0 0 0 1px var(--live),0 0 24px var(--live-a)}
@media (prefers-reduced-motion:reduce){.scene.on::after,body.on-air #monWrap::after{filter:drop-shadow(0 0 4px var(--e,var(--acc)))}}
#livePill{min-height:34px;padding:0 10px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--mono);letter-spacing:.1em;
  color:#fff;background:rgba(255,31,61,.16);border:1px solid var(--live)}
#livePill[hidden]{display:none}
body.on-air #dots{display:none}   /* the top bar has no room for both on a 375 px phone; the pill matters more */
#top .brand{flex:1 1 0;min-width:0;overflow:hidden}
#livePill i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 1.2s steps(2) infinite}
#badge span.live{background:var(--live)}
#tabs button.onair{color:var(--live-hi)}
#tabs button.onair .pill{background:rgba(255,31,61,.18);color:var(--live-hi);box-shadow:0 0 12px var(--live-a)}
#tabs button.onair.on .pill{background:rgba(255,31,61,.28)}

/* UI 2.0 step 3: Perform and Auto */
.scenes{display:grid;grid-template-columns:repeat(var(--sc-cols,3),minmax(0,1fr));gap:8px;overflow:visible;padding:2px 0 4px}
.scene{flex:none;width:auto;height:auto;aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);--c:var(--faint);box-shadow:inset 0 -3px 0 var(--c)}
.scene::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.78));pointer-events:none}
.scene b{z-index:1;left:auto;right:7px;top:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.8)}
.scene small{z-index:1;margin:0 0 9px 8px;padding:0;background:none;font-size:11px;letter-spacing:.12em;text-shadow:0 1px 4px #000}
.scene.on{box-shadow:inset 0 -3px 0 var(--c),0 0 14px var(--acc-muted)}
.scene .nb{display:none;position:absolute;left:6px;top:6px;z-index:2;font:700 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#000;padding:4px 5px;border-radius:4px;font-style:normal}
.scene.q .nb{display:block}
.scene.q{box-shadow:inset 0 -3px 0 var(--c),0 0 0 1px rgba(255,255,255,.5)}
.layer{padding:8px 10px 2px;margin:8px 0}
.layer .tile{flex-basis:100px;height:56px}
.pads button.held{background:rgba(255,31,61,.22);color:#fff;border-color:var(--live);box-shadow:0 0 18px var(--live-a)}
.pads button.strobe.held{animation:padflash .23s steps(2) infinite}
@keyframes padflash{50%{background:rgba(255,31,61,.55)}}
.autohead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin-top:10px}
.autohead .t{flex:1;min-width:0}.autohead .t b{display:block;font:700 19px/1.1 var(--display);letter-spacing:.02em}
.autohead .t small{display:block;color:var(--dim);font-size:12px;line-height:1.35;margin-top:4px}
.autohead.on{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.autohead.on .t b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);margin-right:8px;vertical-align:middle;animation:blink 1.2s steps(2) infinite}
button.stopbtn{flex:none;min-height:46px;padding:0 18px;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(255,31,61,.16);border-color:var(--live)}
.ramp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ramp span{--c:var(--faint);text-align:center;font:700 11px/34px var(--display);letter-spacing:.12em;text-transform:uppercase;border-radius:9px;
  color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 14%,#08080b);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);transition:background .2s,box-shadow .2s}
.ramp span.on{background:var(--c);color:#fff;box-shadow:0 0 14px var(--c)}
.nextchg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:grid;gap:8px}
.nextchg .row{justify-content:space-between}.nextchg .row>*{flex:0 0 auto}
.nextchg .a-nextl{font:600 13px var(--sans)}.nextchg em{font:700 12px var(--mono);font-style:normal;color:var(--acc)}
.nextchg .bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nextchg .bars i{height:5px;border-radius:3px;background:#1d1f27}.nextchg .bars i.on{background:var(--acc)}

/* UI 2.0 step 4: Library and Live */
.store{display:grid;gap:6px;margin:8px 0 10px}
.store .row{justify-content:space-between;font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.store .row>*{flex:0 1 auto}
.store .bar{height:4px;border-radius:2px;background:#1b1c22;overflow:hidden}.store .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#fff))}
.lib{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.lib .tile{aspect-ratio:1;border-radius:10px}
.lib .tile span{font:600 10px/1.2 var(--mono);letter-spacing:.03em;text-transform:uppercase}
.fab{position:sticky;bottom:12px;margin:-8px 4px 0 auto;display:flex;align-items:center;justify-content:center;width:56px;height:56px;min-height:0;padding:0;border-radius:18px;
  background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 0 22px var(--acc-muted),0 8px 22px rgba(0,0,0,.6);z-index:5}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.procard{background:linear-gradient(135deg,rgba(255,31,61,.13),rgba(42,108,255,.08) 70%),var(--card);border-color:rgba(255,31,61,.45);box-shadow:0 0 18px rgba(255,31,61,.12)}
.procard .lhead .k{font:700 10px/1 var(--mono);letter-spacing:.12em;font-style:normal;background:var(--live);color:#fff;padding:4px 7px;border-radius:5px}
.onair{display:grid;justify-items:center;gap:4px;text-align:center;padding:16px 12px 14px;margin-top:10px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.onair b.b-air{font:700 30px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.onair small{color:var(--dim);font-size:12px}
.onair.wait b.b-air{font-size:20px;color:var(--warn)}
.onair.on{background:radial-gradient(circle at 50% 0%,rgba(255,31,61,.25),transparent 70%),var(--card);border-color:var(--live);box-shadow:0 0 22px var(--live-a)}
.onair.on b.b-air{color:#fff;text-shadow:0 0 18px var(--live),0 0 2px var(--live-hi)}
.onair .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:10px}
.onair .kv div{background:rgba(0,0,0,.35);border-radius:10px;padding:8px 4px}
.onair .kv b{display:block;font:700 18px/1 var(--mono)}.onair .kv small{display:block;font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
button.live-go{background:var(--live);border-color:var(--live);color:#fff;box-shadow:0 0 18px var(--live-a);margin-top:10px}
button.ghost-line{background:transparent;color:var(--dim);margin-top:10px}
.qrcard{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.qrcard .qr{margin:0;padding:8px;border-radius:10px;width:auto}
.qrcard .qr canvas{width:104px;height:104px}
.qrside{min-width:0;display:grid;gap:6px}
.qrside .link{padding:8px;font-size:11px;color:var(--acc)}
.qrside .hint{margin:0;font-size:12px}
.qrside .acts{display:flex;gap:6px;flex-wrap:wrap}.qrside .acts button{min-height:36px;padding:0 10px;font-size:13px;border-radius:9px}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:0 12px}
details.more summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--txt)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'+';font:400 20px var(--mono);color:var(--dim)}
details.more[open] summary::after{content:'–'}
details.more[open]{padding-bottom:12px}

/* splash */
#splash{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:min(56vw,240px);height:auto;filter:drop-shadow(0 0 26px rgba(42,108,255,.35))}
#splash b{font:600 12px/1 var(--display);letter-spacing:.42em;padding-left:.42em;color:#868a93}
#splash .sbar{width:min(48vw,200px);height:2px;background:#15161c;border-radius:2px;overflow:hidden;margin-top:16px}
#splash .sbar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,#6f9bff,transparent);animation:sload 1.1s ease-in-out infinite}
@keyframes sload{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#splash small{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#4d5059}
/* first-run tour: a spotlight on the real control and a card that explains it */
#tour{position:fixed;inset:0;z-index:90}
#tour .spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.76);transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;pointer-events:none}
#tour .spot::after{content:'';position:absolute;inset:0;border-radius:inherit;border:2px solid #6f9bff;filter:url(#electric) drop-shadow(0 0 3px var(--acc)) drop-shadow(0 0 8px var(--acc))}
#tour .tcard{position:fixed;left:16px;right:16px;max-width:380px;margin:0 auto;background:var(--card);border:1px solid var(--ctl-line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 14px 44px rgba(0,0,0,.75);display:grid;gap:8px}
#tour .tk{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
#tour .tcard b{font:700 20px/1.15 var(--display);letter-spacing:.02em}
#tour .tcard p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
#tour .tfoot{display:flex;align-items:center;gap:8px;margin-top:4px}
#tour .dots{display:flex;gap:5px;flex:1}#tour .dots i{width:6px;height:6px;border-radius:50%;background:#2a2c36}#tour .dots i.on{background:var(--acc);box-shadow:0 0 6px var(--acc)}
#tour .tfoot button{min-height:40px;padding:0 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){#tour .spot::after{filter:drop-shadow(0 0 4px var(--acc))}}

/* sign-in wall: the phone app opens only for a signed-in Strodano account (any plan, Free included) */
.wall{position:fixed;inset:0;z-index:150;background:radial-gradient(ellipse at 50% 30%,rgba(42,108,255,.16),transparent 60%),#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-right)) calc(24px + var(--safe-b)) max(24px,env(safe-area-inset-left));text-align:center}
.wall img{width:min(52vw,220px);height:auto;filter:drop-shadow(0 0 24px rgba(42,108,255,.35))}
.wall b{font:700 24px/1.15 var(--display);letter-spacing:.02em;margin-top:10px}
.wall p{margin:0;max-width:330px;color:var(--dim);font-size:15px;line-height:1.5}
.wall .acts{display:grid;gap:10px;width:min(330px,100%);margin-top:10px}
.wall .free{font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.wall small{color:var(--faint);font-size:12px;max-width:330px;line-height:1.45}

/* install step: one screen per platform */
.wall ol.isteps{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px;width:min(330px,100%);text-align:left;counter-reset:st}
.wall ol.isteps li{counter-increment:st;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);font-size:14px;line-height:1.35}
.wall ol.isteps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--mono);background:var(--acc-btn);color:var(--acc)}
.wall ol.isteps svg{width:20px;height:20px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:auto}
.wall .later{background:none;border:0;min-height:40px;color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.wall .why{color:var(--faint);font-size:12px;max-width:330px;line-height:1.45}
</style>
</head>
<body>
<!-- splash: shown from the first paint, before any script; mobileui.js fades it out after the first frame (splashHide),
     and this timer takes it away anyway if start-up fails -->
<div id="splash" role="status" aria-label="Loading Strodano VJ"><img src="logo.png" alt=""><b>VJ MOBILE</b><div class="sbar"><i></i></div><small>Loading the visuals</small></div>
<script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('gone'); }, 12000);</script>
<!-- the website's electric border (ElectricDefs.jsx): one shared filter, used only by what is live or playing -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="electric" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.02 0.035" numOctaves="2" seed="2" result="noise">
      <animate attributeName="seed" values="2;7;13;21;34;55;89;144" dur="0.56s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div id="app">
  <header id="top">
    <div class="brand"><img src="logo.png" alt="Strodano"><span>VJ MOBILE</span></div>
    <button id="installBtn" hidden>Install</button>
    <button id="setBtn" class="icon" aria-label="Settings" title="Settings"></button>
    <button id="livePill" hidden title="Your show is on air: open Live"><i></i>LIVE</button>
    <button id="bpmBtn" title="Tap the tempo"><span id="dots"><i></i><i></i><i></i><i></i></span><b id="bpmVal">120</b></button>
    <button id="blackBtn" title="Fade the output to black and back">BLACK</button>
  </header>
  <div id="stage"><div id="monWrap"><canvas id="mon" width="640" height="360"></canvas><div id="badge"></div><div id="fps"></div><button id="monBtn" aria-label="Smaller or larger monitor" title="Smaller or larger monitor"></button></div></div>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>
<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<div id="status" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept="video/*,image/*" multiple hidden>
<input type="file" id="songInput" accept="audio/*,video/mp4,video/webm" hidden>
<input type="file" id="compInput" accept=".svj,application/json" hidden>

<script src="core.js"></script>
<script src="plan.js"></script>
<script src="shaders.js"></script>
<script src="engine.js"></script>
<script src="mediafolder.js"></script>
<script src="midi.js"></script>
<script src="audio.js"></script>
<script src="live.js"></script>
<script src="looks.js"></script>
<!-- Strodano VJ Pro (closed source): the stored bundle, downloaded after sign-in to a paid plan (prodl.js) -->
<script src="prodl.js"></script>
<script src="motion.js"></script>
<script src="camera.js"></script>
<script src="text.js"></script>
<script src="vendor/three.min.js"></script>
<script src="smart3d.js"></script>
<script src="lowpoly.js"></script>
<script src="hands.js"></script>
<script src="inputs.js"></script>
<script src="safety.js"></script>
<script src="display.js"></script>
<script src="ndi.js"></script>
<script src="vdo.js"></script>
<script src="clipopts.js"></script>
<script src="snapshots.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="medialib.js"></script>
<script src="starter.js"></script>
<script src="workspace.js"></script>
<script src="mobileui.js"></script>
</body>
