<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRODANO VJ · Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="STRODANO VJ · Live">
<meta property="og:description" content="Live visuals, streamed from Strodano VJ.">
<link rel="icon" href="/logo.png">
<!-- Strodano VJ - the branded viewer for a web link (vdo.js). GPL-3.0.
     Served at /live/<name> (vercel.json rewrite; also /watch.html?v=<name>). The password is in the #fragment, so it is
     never sent to this server, never logged and never passed on as a Referer. The picture comes peer to peer through the
     VDO.Ninja SDK (vendor/vdoninja-sdk.min.js, MPL-2.0); vdo.ninja's servers only introduce the two ends.
     Add &clean to the fragment (or ?clean) for OBS / a projector: no overlays, no cursor. -->
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .6s}
  body.live video{opacity:1}
  #wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .6s}
  body.live #wait{opacity:0;pointer-events:none}
  #wait img{width:min(260px,56vw);height:auto;animation:pulse 2.4s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(92,120,255,.35))}
  #msg{color:#9a9aa6;max-width:360px}
  @keyframes pulse{50%{opacity:.55;transform:scale(.98)}}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));transition:opacity .4s}
  body.idle #bar{opacity:0;pointer-events:none}
  button{font:600 14px inherit;font-family:inherit;color:#fff;background:rgba(30,30,36,.85);border:1px solid #3a3a44;border-radius:22px;min-height:44px;padding:0 18px;cursor:pointer}
  button.hot{background:#cc6688;border-color:#cc6688;color:#0a0a0a}
  button[hidden]{display:none}
  #tag{position:fixed;left:14px;top:12px;font:700 11px/1 inherit;font-family:inherit;letter-spacing:.12em;display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;background:rgba(0,0,0,.55);transition:opacity .4s}
  #tag i{width:7px;height:7px;border-radius:50%;background:#555}
  body.live #tag i{background:#ef4d55;animation:blink 1.2s infinite}
  body.idle #tag{opacity:0}
  @keyframes blink{50%{opacity:.3}}
  body.clean #bar,body.clean #tag,body.clean #wait p{display:none}
  body.clean.live,body.clean.idle{cursor:none}
</style>
</head>
<body class="idle">
<video id="v" playsinline autoplay muted></video>
<div id="wait"><img src="/logo.png" alt="STRODANO"><p id="msg">Connecting…</p></div>
<div id="tag"><i></i><span id="tagText">STRODANO VJ</span></div>
<div id="bar"><button id="snd" class="hot" hidden>Tap for sound</button><button id="fs">Full screen</button></div>
<script src="/vendor/vdoninja-sdk.min.js"></script>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id), v = $('v'), body = document.body;
  // /live/<name>#<password>[&clean]   or   /watch.html?v=<name>#<password>   or the old ?view=&password= form
  const q = new URLSearchParams(location.search), frag = location.hash.slice(1).split('&');
  const m = location.pathname.match(/\/live\/([A-Za-z0-9_]{4,64})\/?$/);
  const id = (m && m[1]) || q.get('v') || q.get('view') || '';
  const pw = (frag[0] && !frag[0].includes('=') ? frag[0] : '') || q.get('password') || q.get('k') || '';
  if (frag.includes('clean') || q.has('clean')) body.classList.add('clean');
  const msg = t => { $('msg').textContent = t; };
  if (!/^[A-Za-z0-9_]{4,64}$/.test(id)) { msg('This link is not complete. Ask for the full link (it ends with # and a code).'); return; }
  if (pw && !/^[A-Za-z0-9]{1,64}$/.test(pw)) { msg('This link is not complete. Ask for the full link.'); return; }
  $('tagText').textContent = 'LIVE · ' + id.replace(/^svj_/, '').replace(/_/g, ' ').toUpperCase();
  document.title = 'STRODANO VJ · ' + id.replace(/_/g, ' ');

  let sdk = null, tracks = {}, retry = 0, idleT = 0;
  const isLive = () => tracks.video && tracks.video.readyState === 'live';
  function show() {
    v.srcObject = new MediaStream(Object.values(tracks).filter(t => t && t.readyState === 'live'));
    v.play().catch(() => {});
    $('snd').hidden = !(tracks.audio && v.muted);
  }
  function waiting(t) { body.classList.remove('live'); msg(t || 'Waiting for the show to start…'); schedule(); }
  function schedule() {
    clearTimeout(retry);
    retry = setTimeout(() => { if (!isLive()) view(); }, 5000);
  }
  async function view() {
    if (!sdk) return;
    try { await sdk.view(id, { audio: true, video: true }); } catch (e) {}
    schedule();
  }
  async function start() {
    if (!window.VDONinjaSDK) { msg('Could not load the player. Check the connection and reload.'); return; }
    sdk = new VDONinjaSDK({ salt: 'vdo.ninja', password: pw || undefined });
    sdk.addEventListener('track', e => {
      const t = e.detail && e.detail.track;
      if (!t) return;
      tracks[t.kind] = t;
      t.addEventListener('ended', () => { if (tracks[t.kind] === t) { tracks[t.kind] = null; if (t.kind === 'video') waiting('The show paused. Waiting for it to come back…'); } });
      show();
      if (t.kind === 'video') body.classList.add('live');
    });
    sdk.addEventListener('peerDisconnected', () => { tracks = {}; waiting('The show paused. Waiting for it to come back…'); });
    sdk.addEventListener('reconnecting', () => msg('Reconnecting…'));
    try { await sdk.connect(); } catch (e) { msg('Could not connect. Check the connection; trying again…'); setTimeout(start, 5000); return; }
    msg('Waiting for the show to start…');
    view();
  }
  $('snd').onclick = () => { v.muted = false; v.play().catch(() => {}); $('snd').hidden = true; };
  $('fs').onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else (d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen() : v.webkitEnterFullscreen && v.webkitEnterFullscreen()); };
  v.addEventListener('dblclick', () => $('fs').click());
  // controls show on a touch or mouse move, then fade
  const wake = () => { body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (isLive()) body.classList.add('idle'); }, 3000); };
  ['pointermove', 'pointerdown', 'keydown'].forEach(t => window.addEventListener(t, wake));
  wake();
  start();
})();
</script>
</body>
</html>
